<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Protótipo de loop — World City Map</title>
<style>
:root{
  --ground:#15120d; --surface:#1d1913; --sunken:#110e0a;
  --line:#332c22; --line-soft:#282219;
  --ink:#ece5d8; --dim:#a1957f; --faint:#796e5c;
  --accent:#d99a2b; --accent-soft:#3a2c13;
  --water:#5b9dc0; --miss:#cf6a4c; --good:#7fa06d;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:3px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font:14px/1.55 var(--sans);
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
button:disabled{cursor:not-allowed;opacity:.38}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* topo */
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:9px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.hb{font-weight:640;white-space:nowrap}
.hb small{color:var(--faint);font-weight:400}
.modes{display:flex;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.modes button{padding:5px 12px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.modes button+button{border-left:1px solid var(--line)}
.res{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.r{display:flex;flex-direction:column;line-height:1.15}
.r b{font-family:var(--mono);font-size:16px;font-variant-numeric:tabular-nums}
.r span{font-size:9.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--faint)}
.r.hl b{color:var(--accent)}
#next{padding:7px 16px;border:1px solid var(--accent);color:var(--accent);
  border-radius:var(--r);font-weight:600;font-size:13px;white-space:nowrap}
#next:hover:not(:disabled){background:var(--accent-soft)}

/* calendário */
.cal{display:flex;gap:2px;padding:7px 16px;background:var(--sunken);
  border-bottom:1px solid var(--line);overflow-x:auto}
.wk{flex:0 0 auto;width:30px;height:26px;border-radius:2px;background:var(--line-soft);
  display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--faint);
  position:relative}
.wk.now{background:var(--accent);color:#15120d;font-weight:700}
.wk.past{background:var(--line);color:var(--dim)}
.wk.ev::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;
  border-radius:50%;background:var(--water)}
.wk.now.ev::after{background:#15120d}

/* corpo */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 350px;min-height:0}
#stage{overflow-y:auto;padding:16px}
#side{overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:16px}
@media (max-width:1000px){main{grid-template-columns:1fr} #side{display:none}}

.path{display:flex;align-items:center;gap:3px;flex-wrap:wrap;margin-bottom:14px}
.path button{padding:3px 8px;border-radius:2px;font-size:12.5px;color:var(--dim)}
.path button:hover{background:var(--sunken);color:var(--ink)}
.path button[aria-current]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.path .lv{font-family:var(--mono);font-size:10px;opacity:.75;margin-right:4px}
.path i{color:var(--line);font-style:normal;font-size:10px}

h2.scope{margin:0 0 3px;font-size:21px;font-weight:640}
.sub{color:var(--dim);font-size:12.5px;margin:0 0 16px}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(216px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  overflow:hidden;display:flex;flex-direction:column;transition:border-color .12s}
.card:hover{border-color:var(--accent)}
.card .sw{height:44px}
.card .bd{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px;flex:1}
.card .nm{font-size:13px;font-weight:600;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.chip{font-family:var(--mono);font-size:9.5px;padding:1px 5px;border-radius:2px;
  border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.chip.act{border-color:var(--accent);color:var(--accent)}
.chip.done{border-color:var(--good);color:var(--good)}
.chip.bond{border-color:var(--water);color:var(--water)}

.acts{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.act{border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;
  background:var(--surface);display:flex;flex-direction:column;gap:5px;
  transition:border-color .12s}
.act:hover:not(:disabled){border-color:var(--accent)}
.act .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.act .lab{font-size:13.5px;font-weight:600}
.act .txt{font-size:11.5px;color:var(--dim);line-height:1.5}
.act .cost{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--accent);
  white-space:nowrap}
.act.boost{border-color:var(--water)}
.act.boost .cost{color:var(--water)}

.blank{border:1px dashed var(--line);border-radius:var(--r);padding:20px;
  color:var(--dim);font-size:12.5px}
.blank b{display:block;color:var(--ink);margin-bottom:3px}

/* lateral */
.sec{margin-bottom:18px}
.sec h3{margin:0 0 7px;font-size:9.5px;text-transform:uppercase;letter-spacing:.1em;
  color:var(--faint);font-weight:640}
.bar{height:5px;border-radius:3px;background:var(--sunken);overflow:hidden;margin:3px 0 8px}
.bar i{display:block;height:100%;background:var(--water)}
.mrow{display:flex;justify-content:space-between;font-size:12px;gap:8px}
.mrow b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:5px;max-height:290px;overflow-y:auto}
.li{font-size:11.5px;color:var(--dim);border-left:2px solid var(--line);padding-left:8px;
  line-height:1.45}
.li b{color:var(--ink);font-weight:600}
.li.ev{border-left-color:var(--water)}
.li.ev b{color:var(--water)}
.li.warn{border-left-color:var(--miss)}

.verdict{border:1px solid var(--accent);border-radius:var(--r);padding:12px;
  background:var(--accent-soft);margin-bottom:16px}
.verdict h3{color:var(--accent);margin-bottom:5px}
.verdict p{margin:0 0 6px;font-size:12px;line-height:1.5}
.verdict .mrow{margin-bottom:2px}
</style>
</head>
<body>

<header>
  <div class="hb">Protótipo de loop <small id="hsub"></small></div>
  <div class="modes" id="modes"></div>
  <div class="res" id="res"></div>
  <button id="next">Avançar semana →</button>
</header>

<div class="cal" id="cal"></div>

<main>
  <section id="stage"></section>
  <aside id="side"></aside>
</main>

<script src="../../build/world.data.js"></script>
<script>
(function(){
const W = window.WORLD;
if(!W){document.getElementById('stage').innerHTML=
  '<div class="blank"><b>build/world.data.js ausente</b>Rode <code>python3 tools/worldbuild.py</code>.</div>';return;}
const N = W.nodes;
const KIND={region:'região',state:'estado',subregion:'sub-região',city:'cidade',
            district:'bairro',venue:'local'};

/* ── modos: os três verbos candidatos ────────────────────────────────
   Mesmos dados, mesma árvore. Muda o recurso, o nível em que se age e o
   que a ação constrói. É esse contraste que o protótipo existe para medir. */
const MODES={
  torcida:{
    nome:'Torcida', sub:'life-sim · age no LOCAL',
    recurso:'Tempo', porSemana:3, actLevel:5,
    explica:'Você gasta tempo nos locais. Cada ação constrói vínculo com o bairro e perícia no tipo de atividade.',
    ganho:(a)=>({vinculo:a.cadence!=='any'?9:6, pericia:1})
  },
  matchday:{
    nome:'Dia de Jogo', sub:'tycoon · age no BAIRRO',
    recurso:'Verba', porSemana:4, actLevel:4,
    explica:'Você investe nos bairros para dar conta do fluxo de torcida. Locais viram capacidade e transporte.',
    ganho:(a)=>({capacidade:a.kind==='transit'?12:7, pericia:0})
  },
  campanha:{
    nome:'Campanha', sub:'estratégia · age na CIDADE',
    recurso:'Influência', porSemana:2, actLevel:3,
    explica:'Você age só no mapa nacional. Os locais nunca são visitados — viram um somatório de modificadores.',
    ganho:()=>({influencia:10, pericia:0})
  }
};

/* ── calendário: eventos reais tirados dos dossiês e da lente ─────── */
const SEMANAS=16;
const AGENDA={
  2:{n:'Lavagem do Bonfim',alvo:'bonfim',tipo:'annual'},
  4:{n:'Rodada do Brasileirão',alvo:'lens',tipo:'match'},
  5:{n:'Festa de Iemanjá (2/2)',alvo:'rio-vermelho',tipo:'annual'},
  7:{n:'Carnaval',alvo:'cidade',tipo:'annual'},
  8:{n:'Rodada do Brasileirão',alvo:'lens',tipo:'match'},
  10:{n:'Clássico Ba-Vi',alvo:'lens',tipo:'match'},
  12:{n:'Rodada do Brasileirão',alvo:'lens',tipo:'match'},
  14:{n:'Terça da Bênção (semanal)',alvo:'pelourinho',tipo:'weekly'},
  16:{n:'Última rodada',alvo:'lens',tipo:'match'}
};

/* ── estado ───────────────────────────────────────────────────────── */
let modo='torcida', semana=1, saldo=MODES.torcida.porSemana;
let scope=null, log=[], feitas={}, vinculo={}, pericia={}, visitados={}, maxNivel=0, cliques=0;

const $=i=>document.getElementById(i);
const E=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
const kidsOf=id=>(id===null?W.roots:N[id].childIds).slice()
  .sort((a,b)=>(N[a].level-N[b].level)||N[a].name.localeCompare(N[b].name,'pt-BR'));
const chain=id=>{const o=[];let c=id;while(c){o.unshift(c);c=N[c].parentId;}return o;};
const cidadeDe=id=>chain(id).find(x=>N[x].kind==='city')||null;

function reset(novo){
  modo=novo; semana=1; saldo=MODES[modo].porSemana; scope=null;
  log=[]; feitas={}; vinculo={}; pericia={}; visitados={}; maxNivel=0; cliques=0;
  diz(`Modo <b>${MODES[modo].nome}</b>. ${MODES[modo].explica}`);
  draw();
}
function diz(html,cls){log.unshift({html,cls:cls||''});}

/* ── ações disponíveis no escopo atual ───────────────────────────────
   A ação nasce do campo 'Gameplay Function' do dossiê, derivada no
   exportador. Se um local não tem esse campo, ele não gera jogo — e é
   exatamente isso que queremos descobrir. */
function acoesDe(id){
  if(id===null) return [];
  const n=N[id], lvl=MODES[modo].actLevel, out=[];
  const colher=(no)=>{
    for(const a of (no.detail&&no.detail.actions)||[])
      out.push({...a, origem:no.id, origemNome:no.name});
  };
  if(n.level===lvl) {
    colher(n);
    // níveis acima do local agregam as ações dos descendentes
    if(lvl<5){ const pilha=[...n.childIds];
      while(pilha.length){ const c=N[pilha.pop()]; colher(c); pilha.push(...c.childIds); } }
  }
  return out;
}

/* Quantas ações existem na subárvore deste nó. Sem isso o jogador no mapa
   nacional não tem como saber onde há conteúdo — descobrimos essa lacuna
   jogando: um bot guloso não conseguia achar Salvador partindo do Brasil. */
const _sub={};
function acoesNaSubarvore(id){
  if(id in _sub) return _sub[id];
  const n=N[id];
  let t=((n.detail&&n.detail.actions)||[]).length;
  for(const c of n.childIds) t+=acoesNaSubarvore(c);
  return _sub[id]=t;
}

function eventoDaSemana(){return AGENDA[semana]||null;}
function temBoost(a){
  const ev=eventoDaSemana(); if(!ev) return false;
  if(ev.tipo==='match') return a.kind==='event'||a.kind==='transit';
  if(a.cadence===ev.tipo) return true;
  return ev.alvo && a.origem.includes(ev.alvo);
}

function agir(a){
  if(saldo<=0) return;
  saldo--; cliques++;
  const chave=a.origem+'|'+a.id; feitas[chave]=(feitas[chave]||0)+1;
  const boost=temBoost(a);
  const g=MODES[modo].ganho(a);
  const cid=cidadeDe(a.origem)||a.origem;
  const bairro=chain(a.origem).find(x=>N[x].kind==='district')||cid;
  const mult=boost?2:1;
  if(g.vinculo){vinculo[bairro]=Math.min(100,(vinculo[bairro]||0)+g.vinculo*mult);}
  if(g.capacidade){vinculo[bairro]=Math.min(100,(vinculo[bairro]||0)+g.capacidade*mult);}
  if(g.influencia){vinculo[cid]=Math.min(100,(vinculo[cid]||0)+g.influencia*mult);}
  if(g.pericia){pericia[a.kind]=(pericia[a.kind]||0)+g.pericia*mult;}
  diz(`<b>${a.label}</b> — ${N[a.origem].name}${boost?' · <b>evento em curso, efeito dobrado</b>':''}`,
      boost?'ev':'');
  draw();
}

function avancar(){
  if(semana>=SEMANAS){ diz('<b>Fim da temporada.</b> Veja o balanço ao lado.','ev'); draw(); return; }
  semana++; saldo=MODES[modo].porSemana;
  const ev=eventoDaSemana();
  if(ev) diz(`Semana ${semana}: <b>${ev.n}</b>. Ações relacionadas rendem em dobro.`,'ev');
  else diz(`Semana ${semana}.`);
  draw();
}

/* ── desenho ─────────────────────────────────────────────────────── */
function drawHeader(){
  $('hsub').textContent='· '+MODES[modo].sub;
  const m=$('modes'); m.innerHTML='';
  for(const k of Object.keys(MODES)){
    const b=E('button',null,MODES[k].nome);
    b.setAttribute('aria-pressed',String(k===modo));
    b.onclick=()=>reset(k); m.appendChild(b);
  }
  const r=$('res'); r.innerHTML='';
  const add=(v,l,hl)=>{const d=E('div','r'+(hl?' hl':''));
    d.appendChild(E('b',null,v)); d.appendChild(E('span',null,l)); r.appendChild(d);};
  add(`${semana}/${SEMANAS}`,'semana');
  add(saldo,MODES[modo].recurso,true);
  add(Object.keys(visitados).length,'nós visitados');
  add(maxNivel,'nível máx.');
  $('next').disabled = semana>=SEMANAS;
}

function drawCal(){
  const c=$('cal'); c.innerHTML='';
  for(let w=1;w<=SEMANAS;w++){
    const d=E('div','wk'+(w===semana?' now':w<semana?' past':'')+(AGENDA[w]?' ev':''),String(w));
    if(AGENDA[w]) d.title='Semana '+w+': '+AGENDA[w].n;
    c.appendChild(d);
  }
}

function drawStage(){
  const st=$('stage'); st.innerHTML='';
  const p=E('div','path');
  const step=(lv,nm,t,here)=>{const b=E('button');
    if(here)b.setAttribute('aria-current','true');
    b.appendChild(E('span','lv',lv)); b.appendChild(document.createTextNode(nm));
    b.onclick=()=>{scope=t;marcar(t);draw();};return b;};
  p.appendChild(step('—','Brasil',null,scope===null));
  for(const id of chain(scope)){p.appendChild(E('i',null,'▸'));
    p.appendChild(step(String(N[id].level),N[id].name,id,id===scope));}
  st.appendChild(p);

  st.appendChild(E('h2','scope',scope===null?'Brasil':N[scope].name));
  const lvl=MODES[modo].actLevel;
  const sub=E('p','sub');
  sub.textContent = scope===null
    ? `Você age no nível ${lvl} (${KIND[W.levelNames[lvl]]}). Desça a árvore até lá.`
    : `${KIND[N[scope].kind]} · nível ${N[scope].level}` +
      (N[scope].level===lvl?' — você pode agir aqui.':` — desça até o nível ${lvl} para agir.`);
  st.appendChild(sub);

  const acoes=acoesDe(scope);
  if(acoes.length){
    const h=E('div','sec'); h.appendChild(E('h3',null,`Ações disponíveis · ${acoes.length}`));
    st.appendChild(h);
    const box=E('div','acts');
    for(const a of acoes){
      const boost=temBoost(a);
      const b=E('button','act'+(boost?' boost':''));
      b.disabled = saldo<=0;
      const top=E('div','top');
      top.appendChild(E('span','lab',a.label));
      top.appendChild(E('span','chip',a.kind));
      if(a.cadence!=='any') top.appendChild(E('span','chip',a.cadence));
      const n=feitas[a.origem+'|'+a.id]||0;
      if(n) top.appendChild(E('span','chip done','×'+n));
      top.appendChild(E('span','cost',(boost?'2× · ':'')+'1 '+MODES[modo].recurso));
      b.appendChild(top);
      if(a.origem!==scope) b.appendChild(E('div','txt','◦ '+a.origemNome));
      b.appendChild(E('div','txt',a.text));
      b.onclick=()=>agir(a);
      box.appendChild(b);
    }
    st.appendChild(box);
  }

  const kids=kidsOf(scope);
  if(kids.length){
    const h=E('div','sec'); h.appendChild(E('h3',null,'Contido aqui · '+kids.length));
    h.style.marginTop='20px'; st.appendChild(h);
    const g=E('div','grid');
    for(const id of kids){
      const n=N[id], b=E('button','card');
      const sw=E('div','sw');
      const k=n.archetypeResolved&&W.archetypes[n.archetypeResolved];
      sw.setAttribute('style',`background-image:linear-gradient(118deg,${n.color},${k?k.color:n.color})`);
      b.appendChild(sw);
      const bd=E('div','bd'); bd.appendChild(E('div','nm',n.name));
      const ch=E('div','chips');
      ch.appendChild(E('span','chip',KIND[n.kind]));
      const na=acoesDe(id).length;
      if(na) ch.appendChild(E('span','chip act',na+' ação(ões) aqui'));
      else {
        const sub=acoesNaSubarvore(id);
        if(sub) ch.appendChild(E('span','chip act','↓ '+sub+' adiante'));
      }
      if(n.childIds.length) ch.appendChild(E('span','chip',n.childIds.length+' dentro'));
      const v=vinculo[id]; if(v) ch.appendChild(E('span','chip bond',v+'%'));
      bd.appendChild(ch); b.appendChild(bd);
      b.onclick=()=>{scope=id;marcar(id);draw();};
      g.appendChild(b);
    }
    st.appendChild(g);
  } else if(!acoes.length){
    st.appendChild(E('div','blank','Nada contido aqui e nenhuma ação — este nó é decorativo neste modo.'));
  }
}

function marcar(id){ if(id===null)return; visitados[id]=1; maxNivel=Math.max(maxNivel,N[id].level); }

function drawSide(){
  const s=$('side'); s.innerHTML='';

  // balanço de cobertura de conteúdo — o motivo real do protótipo existir
  const totalAcoes=Object.values(N).reduce((a,n)=>a+((n.detail&&n.detail.actions)||[]).length,0);
  const usadas=Object.keys(feitas).length;
  const locais=Object.values(N).filter(n=>n.kind==='venue').length;
  const locaisVis=Object.keys(visitados).filter(i=>N[i].kind==='venue').length;

  if(semana>=SEMANAS){
    const v=E('div','verdict'); v.appendChild(E('h3',null,'Balanço · modo '+MODES[modo].nome));
    const p=E('p'); p.innerHTML=
      `Em ${SEMANAS} semanas você tomou <b>${cliques}</b> decisões e ativou `+
      `<b>${usadas} de ${totalAcoes}</b> ações escritas nos dossiês `+
      `(<b>${Math.round(usadas/totalAcoes*100)}%</b> do conteúdo).`;
    v.appendChild(p);
    const p2=E('p'); p2.innerHTML= locaisVis===0
      ? '<b>Você nunca visitou um local.</b> Neste modo os níveis 4 e 5 da árvore não pagam o próprio custo.'
      : `Você desceu até o nível <b>${maxNivel}</b> e visitou <b>${locaisVis}/${locais}</b> locais.`;
    v.appendChild(p2);
    s.appendChild(v);
  }

  const c=E('div','sec'); c.appendChild(E('h3',null,'Cobertura de conteúdo'));
  const row=(l,val)=>{const d=E('div','mrow');d.appendChild(E('span',null,l));
    d.appendChild(E('b',null,val));c.appendChild(d);};
  row('Ações ativadas',`${usadas}/${totalAcoes}`);
  const bar=E('div','bar'); const fi=E('i');
  fi.style.width=Math.round(usadas/totalAcoes*100)+'%'; bar.appendChild(fi);
  row('Locais visitados',`${locaisVis}/${locais}`);
  row('Decisões tomadas',cliques);
  c.appendChild(bar);
  s.appendChild(c);

  const vs=Object.entries(vinculo).filter(([,v])=>v>0)
    .sort((a,b)=>b[1]-a[1]).slice(0,6);
  if(vs.length){
    const d=E('div','sec'); d.appendChild(E('h3',null,
      modo==='matchday'?'Capacidade por bairro':modo==='campanha'?'Influência por cidade':'Vínculo por bairro'));
    for(const [id,v] of vs){
      const r=E('div','mrow'); r.appendChild(E('span',null,N[id].name.slice(0,26)));
      r.appendChild(E('b',null,v+'%')); d.appendChild(r);
      const b=E('div','bar'); const i=E('i'); i.style.width=v+'%'; b.appendChild(i); d.appendChild(b);
    }
    s.appendChild(d);
  }

  const ps=Object.entries(pericia).sort((a,b)=>b[1]-a[1]);
  if(ps.length){
    const d=E('div','sec'); d.appendChild(E('h3',null,'Perícia por tipo'));
    for(const [k,v] of ps){const r=E('div','mrow');
      r.appendChild(E('span',null,k)); r.appendChild(E('b',null,v)); d.appendChild(r);}
    s.appendChild(d);
  }

  const lg=E('div','sec'); lg.appendChild(E('h3',null,'Registro'));
  const box=E('div','log');
  for(const l of log.slice(0,40)){const d=E('div','li '+l.cls); d.innerHTML=l.html; box.appendChild(d);}
  lg.appendChild(box); s.appendChild(lg);
}

function draw(){drawHeader();drawCal();drawStage();drawSide();}
$('next').onclick=avancar;
diz(`Modo <b>${MODES[modo].nome}</b>. ${MODES[modo].explica}`);
draw();
})();
