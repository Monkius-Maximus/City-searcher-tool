<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World City Map — visualizador</title>
<style>
:root{
  --bg:#0e1116; --bg2:#151a22; --panel:#1a212b; --line:#28313d;
  --ink:#e6edf5; --dim:#8a97a8; --faint:#5b6675;
  --accent:#4ea1ff; --warn:#e0a03a; --err:#e05c5c; --ok:#4fb477;
  --radius:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}

/* ── topo ─────────────────────────────────────────── */
header{
  display:flex;align-items:center;gap:16px;padding:10px 16px;
  background:var(--bg2);border-bottom:1px solid var(--line);flex:0 0 auto;
}
.brand{font-weight:650;letter-spacing:.2px;white-space:nowrap}
.brand small{color:var(--faint);font-weight:400;margin-left:8px}
#search{
  flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:7px 11px;color:var(--ink);outline:none;
}
#search:focus{border-color:var(--accent)}
.stats{margin-left:auto;display:flex;gap:14px;color:var(--dim);font-size:12px;white-space:nowrap}
.stats b{color:var(--ink);font-weight:600}

/* ── trilha ───────────────────────────────────────── */
#crumbs{
  display:flex;align-items:center;gap:4px;flex-wrap:wrap;
  padding:9px 16px;background:var(--bg);border-bottom:1px solid var(--line);flex:0 0 auto;
}
#crumbs button{
  padding:3px 9px;border-radius:6px;color:var(--dim);font-size:13px;
}
#crumbs button:hover{background:var(--panel);color:var(--ink)}
#crumbs button.here{color:var(--ink);font-weight:600;background:var(--panel)}
#crumbs .sep{color:var(--faint);font-size:11px}

/* ── corpo ────────────────────────────────────────── */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 400px;min-height:0}
#stage{overflow-y:auto;padding:18px}
#inspector{
  overflow-y:auto;background:var(--bg2);border-left:1px solid var(--line);padding:18px;
}
@media (max-width:1080px){
  main{grid-template-columns:1fr}
  #inspector{display:none}
  body.has-sel #inspector{
    display:block;position:fixed;inset:0;z-index:20;border:none;
  }
}

.scope{
  display:flex;align-items:baseline;gap:10px;margin-bottom:4px;
}
.scope h1{font-size:19px;margin:0;font-weight:650}
.scope .kind{
  font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--faint);
}
.scope-note{color:var(--dim);font-size:13px;margin:0 0 16px;max-width:70ch}

.sectitle{
  font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);
  margin:22px 0 10px;display:flex;align-items:center;gap:8px;
}
.sectitle::after{content:"";flex:1;height:1px;background:var(--line)}

/* ── grade de filhos ──────────────────────────────── */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;text-align:left;display:flex;flex-direction:column;
  transition:border-color .12s,transform .12s;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.plate{
  height:86px;position:relative;display:flex;align-items:flex-end;padding:8px;
  background-size:cover;
}
.plate .ph{
  position:absolute;inset:0;display:grid;place-items:center;
  font-size:10px;letter-spacing:.5px;color:rgba(255,255,255,.55);
  text-transform:uppercase;font-weight:600;
}
.plate .sig{
  position:relative;font-size:11px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.8);
  line-height:1.3;
}
.cbody{padding:9px 11px 11px;display:flex;flex-direction:column;gap:6px;flex:1}
.cname{font-weight:600;font-size:14px;line-height:1.25}
.cmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}

.tag{
  font-size:10px;padding:2px 6px;border-radius:4px;background:#222b36;
  color:var(--dim);letter-spacing:.3px;white-space:nowrap;
}
.tag.hero{background:#3a2c14;color:#e3b263}
.tag.sig{background:#14303a;color:#63c2e3}
.tag.generic{background:#242c36;color:#8a97a8}
.tag.arch{background:#1e2b22;color:#7fc79a}
.tag.inh{background:#1e2b22;color:#7fc79a;opacity:.72}
.tag.lens{background:#33203a;color:#c98fe0}
.tag.miss{background:#3a1f1f;color:#e08787}
.tag.kids{background:#1c2735;color:#7fa8d8}

.empty{
  color:var(--dim);background:var(--panel);border:1px dashed var(--line);
  border-radius:var(--radius);padding:22px;text-align:center;font-size:13px;
}
.empty b{color:var(--ink);display:block;margin-bottom:4px}

/* ── inspetor ─────────────────────────────────────── */
#inspector h2{font-size:17px;margin:0 0 2px;line-height:1.25}
#inspector .sub{color:var(--faint);font-size:12px;margin-bottom:14px}
.kv{display:grid;grid-template-columns:104px 1fr;gap:5px 10px;font-size:13px;margin-bottom:14px}
.kv dt{color:var(--faint)}
.kv dd{margin:0;word-break:break-word}
.block{margin-bottom:16px}
.block h3{
  font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--faint);
  margin:0 0 6px;font-weight:600;
}
.block p{margin:0 0 8px;font-size:13px;color:#cdd7e3;line-height:1.55}
.prompt{
  background:#101720;border:1px solid var(--line);border-left:2px solid var(--accent);
  border-radius:0 6px 6px 0;padding:9px 11px;font-size:12px;color:#b9c6d6;
  font-style:italic;line-height:1.5;
}
.slots{display:flex;flex-direction:column;gap:5px}
.slot{
  display:flex;align-items:center;gap:8px;font-size:11.5px;
  background:#101720;border:1px solid var(--line);border-radius:6px;padding:6px 9px;
}
.slot code{color:var(--dim);font-size:11px}
.dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.dot.missing{background:var(--err)} .dot.inherited{background:var(--ok)}
.slot .spec{margin-left:auto;color:var(--faint);font-size:10.5px;white-space:nowrap}
.srcref{
  font-size:11px;color:var(--faint);border-top:1px solid var(--line);
  padding-top:10px;margin-top:14px;word-break:break-all;
}
.closebtn{position:absolute;top:12px;right:14px;color:var(--dim);font-size:20px;display:none}
body.has-sel #inspector .closebtn{display:block}
@media (min-width:1081px){.closebtn{display:none!important}}

/* ── resultados de busca ──────────────────────────── */
.hits{display:flex;flex-direction:column;gap:4px}
.hit{
  display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;
  background:var(--panel);border:1px solid var(--line);text-align:left;width:100%;
}
.hit:hover{border-color:var(--accent)}
.hit .path{color:var(--faint);font-size:11px;margin-left:auto;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:45%}
</style>
</head>
<body>

<header>
  <div class="brand">World City Map <small id="ctry"></small></div>
  <input id="search" placeholder="Buscar localidade, bairro, local…  (/)" autocomplete="off">
  <div class="stats" id="stats"></div>
</header>

<nav id="crumbs"></nav>

<main>
  <section id="stage"></section>
  <aside id="inspector"><div class="empty">Selecione algo para inspecionar.</div></aside>
</main>

<script src="../../build/world.data.js"></script>
<script>
(function () {
  const W = window.WORLD;
  if (!W) {
    document.getElementById('stage').innerHTML =
      '<div class="empty"><b>build/world.data.js não encontrado</b>' +
      'Rode <code>python3 tools/worldbuild.py</code> na raiz do repositório.</div>';
    return;
  }

  const N = W.nodes;
  const KIND_PT = {region:'região', state:'estado', subregion:'sub-região',
                   city:'cidade', district:'bairro', venue:'local'};

  // estado de navegação: qual contêiner está aberto e o que está selecionado
  let scope = null;          // null = raiz do mundo
  let sel = null;

  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, txt) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  };

  const childrenOf = (id) =>
    (id === null ? W.roots : (N[id] ? N[id].childIds : []))
      .slice()
      .sort((a, b) => (N[a].level - N[b].level) || N[a].name.localeCompare(N[b].name, 'pt-BR'));

  const ancestors = (id) => {
    const out = [];
    let cur = id;
    while (cur) { out.unshift(cur); cur = N[cur] ? N[cur].parentId : null; }
    return out;
  };

  const missingCount = (id) => {
    const n = N[id]; if (!n) return 0;
    let c = n.assets.filter(a => a.status === 'missing').length;
    for (const k of n.childIds) c += missingCount(k);
    return c;
  };

  const descendants = (id) => {
    let c = 0;
    for (const k of (id === null ? W.roots : N[id].childIds)) c += 1 + descendants(k);
    return c;
  };

  // ── cabeçalho ────────────────────────────────────
  $('ctry').textContent = '· ' + W.country.name;
  const s = W.stats;
  $('stats').innerHTML =
    `<span><b>${s['nós totais']}</b> nós</span>` +
    `<span><b>${s['arquétipos']}</b> arquétipos</span>` +
    `<span><b>${s['slots faltando']}</b> slots faltando</span>` +
    `<span style="color:${W.report.errors.length ? 'var(--err)' : 'var(--ok)'}">` +
    `<b>${W.report.errors.length}</b> erros · <b>${W.report.warnings.length}</b> avisos</span>`;

  // ── trilha ───────────────────────────────────────
  function renderCrumbs() {
    const c = $('crumbs'); c.innerHTML = '';
    const mk = (label, target, here) => {
      const b = el('button', here ? 'here' : '', label);
      b.onclick = () => { scope = target; sel = null; render(); };
      return b;
    };
    c.appendChild(mk('🌍 Mundo', null, scope === null));
    for (const id of ancestors(scope)) {
      c.appendChild(el('span', 'sep', '›'));
      c.appendChild(mk(N[id].name, id, id === scope));
    }
  }

  // ── palco (contêiner atual) ──────────────────────
  function plateStyle(n) {
    const a = n.color;
    const b = n.archetypeResolved && W.archetypes[n.archetypeResolved]
      ? W.archetypes[n.archetypeResolved].color : a;
    return `background-image:linear-gradient(135deg,${a},${b})`;
  }

  function card(id) {
    const n = N[id];
    const b = el('button', 'card' + (sel === id ? ' sel' : ''));

    const plate = el('div', 'plate');
    plate.setAttribute('style', plateStyle(n));
    plate.appendChild(el('div', 'ph', 'placeholder'));
    if (n.signature) plate.appendChild(el('div', 'sig', '▲ ' + n.signature));
    b.appendChild(plate);

    const body = el('div', 'cbody');
    body.appendChild(el('div', 'cname', n.name));
    const meta = el('div', 'cmeta');

    meta.appendChild(el('span', 'tag', KIND_PT[n.kind]));
    if (n.tier) {
      const t = n.tier === 'hero' ? 'hero' : n.tier === 'generic+signature' ? 'sig' : 'generic';
      meta.appendChild(el('span', 'tag ' + t, n.tier));
    }
    if (n.archetypeResolved) {
      meta.appendChild(el('span', 'tag ' + (n.archetypeInheritedFrom ? 'inh' : 'arch'),
        (n.archetypeInheritedFrom ? '↳ ' : '') + n.archetypeResolved));
    }
    for (const lid of Object.keys(n.lens)) {
      meta.appendChild(el('span', 'tag lens', '⚽ ' + n.lens[lid].clubs.length));
    }
    if (n.childIds.length) meta.appendChild(el('span', 'tag kids', n.childIds.length + ' dentro'));
    const miss = missingCount(id);
    if (miss) meta.appendChild(el('span', 'tag miss', miss + ' faltando'));

    body.appendChild(meta);
    b.appendChild(body);

    b.onclick = () => {
      if (sel === id && n.childIds.length) { scope = id; sel = null; }
      else { sel = id; }
      render();
    };
    b.ondblclick = () => { if (n.childIds.length) { scope = id; sel = null; render(); } };
    return b;
  }

  function renderStage() {
    const st = $('stage'); st.innerHTML = '';

    const q = $('search').value.trim().toLowerCase();
    if (q) return renderSearch(st, q);

    const head = el('div', 'scope');
    head.appendChild(el('h1', null, scope === null ? W.country.name : N[scope].name));
    head.appendChild(el('span', 'kind',
      scope === null ? 'país' : KIND_PT[N[scope].kind]));
    st.appendChild(head);

    const kids = childrenOf(scope);
    const note = el('p', 'scope-note');
    note.textContent = scope === null
      ? `${kids.length} regiões · ${descendants(null)} nós no total. Clique para selecionar, clique de novo (ou duplo-clique) para entrar.`
      : `${kids.length} ${kids.length === 1 ? 'filho' : 'filhos'} diretos · ${descendants(scope)} descendentes. `
        + (N[scope].kind === 'city' ? 'Entrar aqui é o "entrar na cidade": só este contêiner fica ativo.' : '');
    st.appendChild(note);

    if (!kids.length) {
      const e = el('div', 'empty');
      e.innerHTML = '<b>Folha da árvore</b>Nada contido aqui. ' +
        (N[scope] && N[scope].kind === 'venue'
          ? 'Um local é o nível mais profundo modelado hoje — é onde a gameplay acontece.'
          : 'Preencha o dossiê desta localidade para gerar bairros e locais.');
      st.appendChild(e);
    } else {
      const byKind = {};
      for (const k of kids) (byKind[N[k].kind] ||= []).push(k);
      for (const kind of ['region','state','subregion','city','district','venue']) {
        if (!byKind[kind]) continue;
        st.appendChild(el('div', 'sectitle', KIND_PT[kind] + ' (' + byKind[kind].length + ')'));
        const g = el('div', 'grid');
        byKind[kind].forEach(k => g.appendChild(card(k)));
        st.appendChild(g);
      }
    }
  }

  function renderSearch(st, q) {
    st.appendChild(el('div', 'sectitle', 'Resultados'));
    const hits = Object.keys(N).filter(id =>
      N[id].name.toLowerCase().includes(q) || id.toLowerCase().includes(q)
    ).slice(0, 60);
    if (!hits.length) { st.appendChild(el('div', 'empty', 'Nada encontrado.')); return; }
    const box = el('div', 'hits');
    for (const id of hits) {
      const n = N[id];
      const b = el('button', 'hit');
      b.appendChild(el('span', 'tag', KIND_PT[n.kind]));
      b.appendChild(el('span', null, n.name));
      b.appendChild(el('span', 'path',
        ancestors(n.parentId).map(a => N[a].name).join(' › ')));
      b.onclick = () => {
        $('search').value = '';
        scope = n.parentId; sel = id; render();
      };
      box.appendChild(b);
    }
    st.appendChild(box);
  }

  // ── inspetor ─────────────────────────────────────
  function block(title, html) {
    const d = el('div', 'block');
    d.appendChild(el('h3', null, title));
    const c = el('div'); c.innerHTML = html; d.appendChild(c);
    return d;
  }
  const esc = (s) => String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  function renderInspector() {
    const ins = $('inspector'); ins.innerHTML = '';
    document.body.classList.toggle('has-sel', !!sel);

    const x = el('button', 'closebtn', '✕');
    x.onclick = () => { sel = null; render(); };
    ins.appendChild(x);

    if (!sel) {
      ins.appendChild(el('div', 'empty', 'Selecione algo para inspecionar.'));
      return;
    }
    const n = N[sel];

    ins.appendChild(el('h2', null, n.name));
    ins.appendChild(el('div', 'sub', KIND_PT[n.kind] + ' · ' + n.id));

    const kv = el('dl', 'kv');
    const row = (k, v) => {
      if (!v) return;
      kv.appendChild(el('dt', null, k));
      kv.appendChild(el('dd', null, v));
    };
    row('Tier', n.tier);
    row('Assinatura', n.signature);
    row('Capital de', n.isCapitalOf);
    row('Cidade gêmea', n.twinCity);
    row('Arquétipo', n.archetypeResolved
      ? n.archetypeResolved + (n.archetypeInheritedFrom ? ` (herdado de ${n.archetypeInheritedFrom})` : ' (próprio)')
      : '— nenhum');
    row('Variantes', (n.variantIds || []).join(', '));
    row('Contém', n.childIds.length ? n.childIds.length + ' nó(s)' : '—');
    ins.appendChild(kv);

    const d = n.detail || {};
    if (d.type) ins.appendChild(block('Tipo', `<p>${esc(d.type)}</p>`));
    if (d.significance) ins.appendChild(block('Significado cultural', `<p>${esc(d.significance)}</p>`));
    if (d.gameplay) ins.appendChild(block('Função de gameplay', `<p>${esc(d.gameplay)}</p>`));
    if (d.visual) ins.appendChild(block('Identidade visual', `<p>${esc(d.visual)}</p>`));
    if (d.zones) ins.appendChild(block('Zonas de gameplay', `<p>${esc(d.zones)}</p>`));
    if (d.description) ins.appendChild(block('Descrição', `<p>${esc(d.description)}</p>`));
    if (d.imagePrompt) ins.appendChild(block('Image prompt (briefing de arte)',
      `<div class="prompt">${esc(d.imagePrompt)}</div>`));
    for (const [k, v] of Object.entries(d.extra || {})) {
      ins.appendChild(block(k, `<p>${esc(v)}</p>`));
    }
    if (d.context) ins.appendChild(block('Contexto', `<p>${esc(d.context).slice(0, 900)}</p>`));
    if (d.artNotes) ins.appendChild(block('Notas de arte', `<p>${esc(d.artNotes).slice(0, 900)}</p>`));

    // arquétipo resolvido
    const a = n.archetypeResolved && W.archetypes[n.archetypeResolved];
    if (a) {
      let h = '';
      if (a.identity) h += `<p>${esc(a.identity)}</p>`;
      if (a.palette) h += `<p><b>Paleta:</b> ${esc(a.palette)}</p>`;
      if (a.signature) h += `<p><b>Silhueta:</b> ${esc(a.signature)}</p>`;
      if (a.imagePrompts && a.imagePrompts[0])
        h += `<div class="prompt">${esc(a.imagePrompts[0])}</div>`;
      ins.appendChild(block('Kit do arquétipo · ' + a.id, h));
    }

    // lentes (overlay separável)
    for (const [lid, ov] of Object.entries(n.lens || {})) {
      let h = '<p>' + ov.clubs.map(c => `<b>${esc(c.club)}</b> — ${esc(c.stadium)}`).join('<br>') + '</p>';
      for (const db of ov.derbies) h += `<p><b>Clássico:</b> ${esc(db.name)}</p>`;
      ins.appendChild(block('Overlay de lente · ' + lid, h));
    }

    // slots de asset
    if (n.assets && n.assets.length) {
      const b = el('div', 'block');
      b.appendChild(el('h3', null, 'Slots de asset (' + n.assets.length + ')'));
      const list = el('div', 'slots');
      for (const sl of n.assets) {
        const r = el('div', 'slot');
        const dot = el('span', 'dot ' + sl.status); r.appendChild(dot);
        const code = el('code', null, sl.slotId); r.appendChild(code);
        const sp = sl.spec || {};
        r.appendChild(el('span', 'spec',
          sp.width ? `${sp.width}×${sp.height}` : sp.seconds ? `${sp.seconds}s` : sl.status));
        r.title = sl.path + (sl.resolvedFrom ? `\n↳ herdado de ${sl.resolvedFrom}` : '');
        list.appendChild(r);
      }
      b.appendChild(list);
      ins.appendChild(b);
    }

    if (n.sourceRef) {
      const s = el('div', 'srcref', 'fonte: ' + n.sourceRef);
      ins.appendChild(s);
    }
  }

  function render() { renderCrumbs(); renderStage(); renderInspector(); }

  $('search').addEventListener('input', () => { sel = null; renderStage(); });
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && document.activeElement !== $('search')) {
      e.preventDefault(); $('search').focus();
    } else if (e.key === 'Escape') {
      if ($('search').value) { $('search').value = ''; render(); }
      else if (sel) { sel = null; render(); }
      else if (scope !== null) { scope = N[scope].parentId; render(); }
    }
  });

  render();
})();
</script>
</body>
</html>
