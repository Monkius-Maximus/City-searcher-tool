<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>City Searcher — mapa de localidades</title>
<style>
:root{
  --bg:#0b0e0d; --panel:#101614; --panel2:#0d1211; --line:#1e2b27;
  --ink:#dfe9e5; --dim:#8798927; --dim2:#7d8c86; --faint:#55625d;
  --accent:#3ddc84;      /* verde do HUD */
  --gold:#e8b73a; --pink:#ff5da2; --blue:#4aa3ff; --violet:#a97bff;
  --teal:#38d6c8; --orange:#ff9f45; --red:#ff6b5e;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"Cascadia Mono",Menlo,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);
  display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
:focus-visible{outline:1px solid var(--accent);outline-offset:2px}

/* ── barra superior ─────────────────────────────────────── */
.hud{display:flex;align-items:center;gap:0;background:var(--panel);
  border-bottom:1px solid var(--line);flex:0 0 auto;height:38px}
.hud .brand{display:flex;align-items:center;gap:7px;padding:0 14px;height:100%;
  border-right:1px solid var(--line);font-weight:700;font-size:12px;letter-spacing:.04em}
.hud .brand span{color:var(--accent)}
.tabs{display:flex;height:100%}
.tabs button{padding:0 13px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);display:flex;align-items:center;gap:6px;height:100%;
  border-right:1px solid var(--line)}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{color:var(--accent);
  box-shadow:inset 0 -2px 0 var(--accent);background:var(--panel2)}
.hudstats{margin-left:auto;display:flex;gap:0;height:100%}
.st{padding:0 13px;display:flex;flex-direction:column;justify-content:center;
  border-left:1px solid var(--line);min-width:62px}
.st b{font-family:var(--mono);font-size:13px;line-height:1.1;font-variant-numeric:tabular-nums}
.st span{font-size:8.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}

/* ── faixa de escopo ────────────────────────────────────── */
.scopebar{display:flex;align-items:center;gap:12px;padding:9px 14px;
  background:var(--panel2);border-bottom:1px solid var(--line);flex:0 0 auto;flex-wrap:wrap}
.crumbs{display:flex;align-items:center;gap:3px;flex-wrap:wrap;min-width:0}
.crumbs button{font-size:12px;color:var(--dim2);padding:2px 7px;border-radius:2px;
  display:flex;align-items:baseline;gap:5px}
.crumbs button:hover{background:var(--line);color:var(--ink)}
.crumbs button[aria-current]{color:var(--accent);font-weight:600;
  border:1px solid var(--accent);background:rgba(61,220,132,.07)}
.crumbs .lv{font-family:var(--mono);font-size:9px;opacity:.7}
.crumbs i{color:var(--line);font-style:normal;font-size:9px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}
.tools button, .tools label{border:1px solid var(--line);border-radius:2px;padding:4px 10px;
  font-size:11px;color:var(--dim2);letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.tools button:hover{border-color:var(--accent);color:var(--ink)}
.tools button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);
  background:rgba(61,220,132,.08)}

/* ── palco ──────────────────────────────────────────────── */
.body{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 296px;min-height:0}
#map{position:relative;background:var(--bg);overflow:hidden}
#map.editing{cursor:crosshair}
svg{width:100%;height:100%;display:block;touch-action:none}

.zone{fill:rgba(255,255,255,.012);stroke-width:1;vector-effect:non-scaling-stroke}
.zone.dimmed{opacity:.3}
.zone.scope{fill:rgba(61,220,132,.03);stroke-dasharray:none}
.zone.child{cursor:pointer}
.zone.child:hover{fill:rgba(61,220,132,.07)}
.zone.sel{stroke-width:2}
.zone.ghost{fill:none;opacity:.22}
.zone.edited{stroke-dasharray:4 3}

.zlabel{font-family:var(--mono);letter-spacing:.13em;
  text-transform:uppercase;pointer-events:none;user-select:none}
.zname{font-family:var(--sans);font-weight:600;pointer-events:none;user-select:none}
.zmeta{font-family:var(--mono);letter-spacing:.08em;fill:var(--faint);
  pointer-events:none;user-select:none}

.pin{cursor:pointer}
.pin rect{stroke-width:1.4;vector-effect:non-scaling-stroke}
.pin text{text-anchor:middle;dominant-baseline:central;
  pointer-events:none;user-select:none}
.pin:hover rect{filter:brightness(1.5)}
.pinlabel{font-family:var(--mono);letter-spacing:.07em;text-anchor:middle;
  pointer-events:none;user-select:none;text-transform:uppercase}

.handle{fill:var(--accent);cursor:nwse-resize}

/* legenda */
.legend{position:absolute;left:12px;bottom:12px;background:rgba(16,22,20,.93);
  border:1px solid var(--line);border-radius:2px;padding:8px 10px;pointer-events:none}
.legend h4{margin:0 0 5px;font-family:var(--mono);font-size:8px;letter-spacing:.13em;
  color:var(--faint);text-transform:uppercase;font-weight:600}
.legend div{display:flex;align-items:center;gap:6px;font-size:9.5px;color:var(--dim2);
  line-height:1.7}
.legend i{width:8px;height:8px;border-radius:1px;display:block;flex:0 0 auto}

.hint{position:absolute;right:12px;bottom:12px;font-family:var(--mono);font-size:9px;
  color:var(--faint);text-align:right;pointer-events:none;line-height:1.7}

/* ── painel lateral ─────────────────────────────────────── */
#side{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;
  display:flex;flex-direction:column}
.sh{padding:11px 13px;border-bottom:1px solid var(--line)}
.sh h3{margin:0;font-size:13px;font-weight:650}
.sh p{margin:2px 0 0;font-size:10.5px;color:var(--faint);font-family:var(--mono);
  word-break:break-all}
.searchbox{padding:9px 13px;border-bottom:1px solid var(--line)}
.searchbox input{width:100%;background:var(--panel2);border:1px solid var(--line);
  border-radius:2px;padding:6px 9px;color:var(--ink);font:inherit;font-size:11.5px;outline:none}
.searchbox input:focus{border-color:var(--accent)}
.searchbox input::placeholder{color:var(--faint)}
.slab{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;color:var(--faint);
  text-transform:uppercase;padding:11px 13px 6px}
.item{display:flex;align-items:center;gap:9px;padding:7px 13px;width:100%;
  border-bottom:1px solid rgba(30,43,39,.5)}
.item:hover{background:var(--panel2)}
.item[aria-current]{background:rgba(61,220,132,.07);
  box-shadow:inset 2px 0 0 var(--accent)}
.item .ic{width:20px;height:20px;border-radius:2px;border:1px solid;display:grid;
  place-items:center;font-size:10px;flex:0 0 auto}
.item .tx{min-width:0;flex:1}
.item .tx b{display:block;font-size:12px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.item .tx span{font-size:9.5px;color:var(--faint);font-family:var(--mono)}
.item .n{font-family:var(--mono);font-size:9px;color:var(--faint)}

.detail{padding:11px 13px;border-top:1px solid var(--line)}
.detail h4{margin:0 0 4px;font-size:8.5px;font-family:var(--mono);letter-spacing:.13em;
  color:var(--faint);text-transform:uppercase}
.detail p{margin:0 0 8px;font-size:11.5px;color:var(--dim2);line-height:1.55}
.tag{display:inline-block;font-family:var(--mono);font-size:9px;padding:1px 5px;
  border:1px solid var(--line);border-radius:2px;color:var(--dim2);margin:0 3px 3px 0}
.acts{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.acti{border:1px solid var(--line);border-radius:2px;padding:6px 8px;font-size:11px;
  display:flex;gap:7px;align-items:baseline}
.acti .g{font-family:var(--mono);font-size:9px;flex:0 0 auto}
.empty{padding:14px 13px;color:var(--faint);font-size:11.5px}
</style>
</head>
<body>

<div class="hud">
  <div class="brand"><span>◈</span> CITY SEARCHER</div>
  <div class="tabs" id="tabs"></div>
  <div class="hudstats" id="hudstats"></div>
</div>

<div class="scopebar">
  <div class="crumbs" id="crumbs"></div>
  <div class="tools">
    <button id="lens" aria-pressed="true">◉ Lente de interações</button>
    <button id="edit" aria-pressed="false">✎ Editar zonas</button>
    <button id="export">⤓ Exportar layout</button>
  </div>
</div>

<div class="body">
  <div id="map">
    <svg id="svg" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="legend" id="legend"></div>
    <div class="hint">clique numa zona para entrar · esc volta<br>arraste para mover · roda dá zoom</div>
  </div>
  <aside id="side"></aside>
</div>

<script src="../../build/world.data.js"></script>
<script>
(function(){
const W=window.WORLD;
if(!W){document.body.innerHTML='<p style="padding:20px">Rode <code>python3 tools/worldbuild.py</code>.</p>';return;}
const N=W.nodes, L=W.layout, SVG=document.getElementById('svg');
const NS='http://www.w3.org/2000/svg';

const KIND={region:'região',state:'estado',subregion:'sub-região',city:'cidade',
            district:'bairro',venue:'local'};
/* categorias de interação — semânticas, separadas da cor de marca.
   Vêm do campo Gameplay Function do dossiê, derivadas no exportador. */
const CAT={
  commerce:{c:'--gold',g:'▤',n:'Comércio'}, event:{c:'--pink',g:'★',n:'Evento'},
  skill:{c:'--accent',g:'◆',n:'Perícia'},  quest:{c:'--violet',g:'❖',n:'Missão'},
  transit:{c:'--blue',g:'⇄',n:'Transporte'}, exploration:{c:'--teal',g:'▲',n:'Exploração'},
  social:{c:'--orange',g:'●',n:'Social'},  unclassified:{c:'--faint',g:'○',n:'Sem tipo'}
};
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

let scope=null, sel=null, lens=true, editing=false, tab='map', query='';
let edits=Object.fromEntries(Object.entries(L).filter(([,r])=>r.edited).map(([k,r])=>[k,r]));
let view={x:0,y:0,w:W.world.w,h:W.world.h}, target={...view};

const el=(t,a)=>{const e=document.createElementNS(NS,t);
  for(const k in (a||{})) e.setAttribute(k,a[k]); return e;};
const kidsOf=id=>(id===null?W.roots:N[id].childIds);
const chain=id=>{const o=[];let c=id;while(c){o.unshift(c);c=N[c].parentId;}return o;};
const rectOf=id=>edits[id]||L[id];
const catOf=n=>{const a=(n.detail&&n.detail.actions)||[];
  return a.length?(CAT[a[0].kind]||CAT.unclassified):CAT.unclassified;};
const actsOf=id=>(N[id].detail&&N[id].detail.actions)||[];
const subActs=id=>{let t=actsOf(id).length;
  for(const c of N[id].childIds) t+=subActs(c); return t;};

/* ── enquadramento: o zoom é contínuo, sem menu entre níveis ── */
function frame(id){
  const r = id===null ? {x:0,y:0,w:W.world.w,h:W.world.h} : rectOf(id);
  if(!r) return;
  const m=Math.max(r.w,r.h)*0.06;
  target={x:r.x-m,y:r.y-m,w:r.w+2*m,h:r.h+2*m};
}
function applyView(){
  SVG.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
}
function tick(){
  const k=0.2, d=['x','y','w','h'].reduce((s,p)=>s+Math.abs(target[p]-view[p]),0);
  if(d>0.4){
    for(const p of ['x','y','w','h']) view[p]+=(target[p]-view[p])*k;
    applyView(); renderMap();            // tamanhos de texto/pin dependem do zoom
    requestAnimationFrame(tick);
  } else { view={...target}; applyView(); renderMap(); }
}

/* ── desenho do mapa ─────────────────────────────────────── */
function draw(){ renderMap(); drawSide(); }

function renderMap(){
  SVG.innerHTML='';
  const scale=view.w/(SVG.clientWidth||SVG.getBoundingClientRect().width||1200);
  const anc=new Set(chain(scope)), kids=kidsOf(scope);

  // ancestrais: só contorno, para você saber onde está
  for(const id of anc){ if(id===scope) continue;
    const r=rectOf(id); if(!r) continue;
    const z=el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:2,
      class:'zone ghost',stroke:N[id].color}); SVG.appendChild(z);
  }
  if(scope!==null){ const r=rectOf(scope);
    if(r) SVG.appendChild(el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:2,
      class:'zone scope',stroke:css('--accent'),'stroke-opacity':.5}));
  }

  for(const id of kids){
    const n=N[id], r=rectOf(id); if(!r) continue;
    const isVenue=n.kind==='venue';

    if(!isVenue){
      const z=el('rect',{x:r.x,y:r.y,width:r.w,height:r.h,rx:2,
        class:'zone child'+(sel===id?' sel':'')+(edits[id]?' edited':''),
        stroke:sel===id?css('--accent'):n.color});
      z.dataset.id=id; SVG.appendChild(z);

      // rótulo de canto, como no protótipo do Madrid
      const labPx=9*scale;                       // 9 px na tela, sempre
      const lab=el('text',{x:r.x+labPx*0.45,y:r.y+labPx*1.15,class:'zlabel',
        fill:n.color,'fill-opacity':.95,'font-size':labPx});
      lab.textContent=(n.signature?'◆ ':'')+n.name.toUpperCase().slice(0,26);
      SVG.appendChild(lab);

      // nome grande no centro quando a zona é grande o bastante na tela
      const pxW=r.w/scale;
      if(pxW>96){
        // cabe na largura da zona E nunca passa de 26 px na tela
        const fit=(r.w*0.92)/Math.max(6,n.name.length)*1.85;
        const fs=Math.min(fit, r.h*0.2, 26*scale);
        const nm=el('text',{x:r.x+r.w/2,y:r.y+r.h/2,class:'zname',
          fill:css('--ink'),'text-anchor':'middle','dominant-baseline':'central',
          'font-size':fs});
        nm.textContent=n.name; SVG.appendChild(nm);
        const na=subActs(id), inner=n.childIds.length;
        if((inner||na) && pxW>140){
          const mp=Math.min(fs*0.42, 9*scale);
          const mt=el('text',{x:r.x+r.w/2,y:r.y+r.h/2+fs*0.95,
            class:'zmeta','text-anchor':'middle','font-size':mp});
          mt.textContent=[inner?inner+' dentro':'',na?na+' interações':''].filter(Boolean).join('  ·  ');
          SVG.appendChild(mt);
        }
      }
      if(editing){
        const hs=Math.max(3,6*scale);
        const h=el('rect',{x:r.x+r.w-hs,y:r.y+r.h-hs,width:hs,height:hs,class:'handle'});
        h.dataset.id=id; h.dataset.resize='1'; SVG.appendChild(h);
      }
    } else if(lens){
      drawPin(id,r,scale);
    }

    // pistas do nível seguinte: pins dos netos aparecem dentro da zona
    if(lens && !isVenue){
      for(const g of n.childIds){
        if(N[g].kind!=='venue') continue;
        const gr=rectOf(g); if(gr) drawPin(g,gr,scale,true);
      }
    }
  }
}

function drawPin(id,r,scale,small){
  const n=N[id], cat=catOf(n), col=css(cat.c);
  const cap=(small?24:46)*scale;                 // teto em px na tela
  const s=Math.min(Math.min(r.w,r.h)*(small?0.5:0.68), cap);
  const cx=r.x+r.w/2, cy=r.y+r.h/2;
  const g=el('g',{class:'pin'}); g.dataset.id=id;
  g.appendChild(el('rect',{x:cx-s/2,y:cy-s/2,width:s,height:s,rx:s*0.2,
    fill:'rgba(0,0,0,.55)',stroke:col,'stroke-opacity':sel===id?1:.85}));
  const t=el('text',{x:cx,y:cy,fill:col,'font-size':s*0.55}); t.textContent=cat.g;
  g.appendChild(t);
  const na=actsOf(id).length;
  if(na>1){ // mais de uma interação no mesmo local
    const b=el('circle',{cx:cx+s/2,cy:cy-s/2,r:s*0.17,fill:col});
    g.appendChild(b);
    const bt=el('text',{x:cx+s/2,y:cy-s/2,fill:'#08120e','font-size':s*0.22,
      'text-anchor':'middle','dominant-baseline':'central'});
    bt.textContent=String(na); g.appendChild(bt);
  }
  SVG.appendChild(g);
  if(!small && s/scale>20){
    const lb=el('text',{x:cx,y:cy+s/2+7*scale,class:'pinlabel',fill:col,
      'font-size':8*scale});
    lb.textContent=n.name.slice(0,22).toUpperCase(); SVG.appendChild(lb);
  }
}

/* ── painel lateral: lista + detalhe ────────────────────── */
function drawSide(){
  const s=document.getElementById('side'); s.innerHTML='';
  const h=document.createElement('div'); h.className='sh';
  const t=document.createElement('h3');
  t.textContent = scope===null ? W.country.name : N[scope].name;
  h.appendChild(t);
  const p=document.createElement('p');
  p.textContent = scope===null
    ? W.country.levels.join(' › ')
    : KIND[N[scope].kind]+' · nível '+N[scope].level+' · '+scope;
  h.appendChild(p); s.appendChild(h);

  // campo de busca: sempre disponível, mas é o foco da aba LOCALIDADES
  const sb=document.createElement('div'); sb.className='searchbox';
  const inp=document.createElement('input');
  inp.placeholder='Buscar em todas as localidades…'; inp.value=query;
  inp.oninput=e=>{query=e.target.value; drawSide();
    const f=document.querySelector('.searchbox input'); if(f){f.focus();
      f.setSelectionRange(f.value.length,f.value.length);}};
  sb.appendChild(inp); s.appendChild(sb);

  if(tab==='list'||query){
    const q=query.trim().toLowerCase();
    const hits=Object.keys(N).filter(i=>!q||N[i].name.toLowerCase().includes(q)
        ||i.toLowerCase().includes(q))
      .sort((a,b)=>(N[a].level-N[b].level)||N[a].name.localeCompare(N[b].name,'pt-BR'))
      .slice(0,120);
    const lab=document.createElement('div'); lab.className='slab';
    lab.textContent=(q?'resultados':'todas as localidades')+' · '+hits.length;
    s.appendChild(lab);
    for(const id of hits) s.appendChild(itemFor(id,true));
    if(sel) s.appendChild(detailFor(sel));
    return;
  }

  const kids=kidsOf(scope);
  const lab=document.createElement('div'); lab.className='slab';
  lab.textContent='contido aqui · '+kids.length; s.appendChild(lab);

  if(!kids.length){
    const e=document.createElement('div'); e.className='empty';
    e.textContent=N[scope]&&N[scope].kind==='venue'
      ? 'Local é a folha da árvore. As interações dele aparecem abaixo.'
      : 'Vazio. Classifique sub-regiões ou cidades aqui para o mapa preencher.';
    s.appendChild(e);
  }
  for(const id of kids.slice().sort((a,b)=>(N[a].level-N[b].level)||
        N[a].name.localeCompare(N[b].name,'pt-BR'))) s.appendChild(itemFor(id));

  if(sel) s.appendChild(detailFor(sel));
}

function itemFor(id,withPath){
    const n=N[id], b=document.createElement('button');
    b.className='item'; if(sel===id) b.setAttribute('aria-current','true');
    const ic=document.createElement('div'); ic.className='ic';
    const isV=n.kind==='venue', cat=catOf(n);
    ic.style.borderColor = isV?css(cat.c):n.color;
    ic.style.color = isV?css(cat.c):n.color;
    ic.textContent = isV?cat.g:(n.tier==='hero'?'◈':'▢');
    b.appendChild(ic);
    const tx=document.createElement('div'); tx.className='tx';
    const nm=document.createElement('b'); nm.textContent=n.name; tx.appendChild(nm);
    const sub=document.createElement('span');
    sub.textContent=[KIND[n.kind],n.tier,n.archetypeResolved&&('↳'+n.archetypeResolved)]
      .filter(Boolean).join(' · ').slice(0,44);
    tx.appendChild(sub); b.appendChild(tx);
    const nn=document.createElement('span'); nn.className='n';
    const na=subActs(id);
    nn.textContent=n.childIds.length?('▸'+n.childIds.length):(na?na+'×':'');
    b.appendChild(nn);
    if(withPath){
      const pth=document.createElement('span'); pth.className='n';
      pth.textContent=chain(n.parentId).map(a=>N[a].name).join(' ▸ ').slice(-28);
      b.appendChild(pth);
    }
    b.onclick=()=>{
      if(withPath){ sel=id; enter(n.parentId); return; }
      if(sel===id&&n.childIds.length) enter(id); else {sel=id; draw();}
    };
    b.ondblclick=()=>enter(id);
    return b;
}

function detailFor(selId){
    const n=N[selId], d=document.createElement('div'); d.className='detail';
    const mk=(ttl,txt)=>{if(!txt)return;const q=document.createElement('h4');
      q.textContent=ttl;d.appendChild(q);const r=document.createElement('p');
      r.textContent=txt;d.appendChild(r);};
    const q=document.createElement('h4'); q.textContent='selecionado'; d.appendChild(q);
    const nm=document.createElement('p'); nm.style.color=css('--ink');
    nm.style.fontWeight='600'; nm.textContent=n.name; d.appendChild(nm);
    for(const [k,v] of [['tier',n.tier],['assinatura',n.signature],
        ['arquétipo',n.archetypeResolved&&(n.archetypeResolved+
          (n.archetypeInheritedFrom?' (herdado)':''))]]){
      if(v){const t=document.createElement('span');t.className='tag';
        t.textContent=k+': '+v;d.appendChild(t);}
    }
    mk('descrição',(n.detail&&(n.detail.description||n.detail.significance))||'');
    mk('zonas de gameplay',(n.detail&&n.detail.zones)||'');
    const A=actsOf(selId);
    if(A.length){
      const q2=document.createElement('h4');
      q2.textContent='interações neste local · '+A.length; d.appendChild(q2);
      const box=document.createElement('div'); box.className='acts';
      for(const a of A){
        const r=document.createElement('div'); r.className='acti';
        const g=document.createElement('span'); g.className='g';
        const c=CAT[a.kind]||CAT.unclassified;
        g.textContent=c.g; g.style.color=css(c.c); r.appendChild(g);
        const tt=document.createElement('span'); tt.textContent=a.label; r.appendChild(tt);
        box.appendChild(r);
      }
      d.appendChild(box);
    }
    return d;
}

function frameSel(id){ /* seleção não muda o zoom; entrar muda */ }
function enter(id){ scope=id; sel=null; frame(id); tick(); draw(); }

/* ── trilha, tabs, stats, legenda ───────────────────────── */
function drawChrome(){
  const c=document.getElementById('crumbs'); c.innerHTML='';
  const mk=(lv,nm,t,here)=>{const b=document.createElement('button');
    if(here)b.setAttribute('aria-current','true');
    const s=document.createElement('span'); s.className='lv'; s.textContent=lv;
    b.appendChild(s); b.appendChild(document.createTextNode(nm));
    b.onclick=()=>enter(t); return b;};
  c.appendChild(mk('—','MUNDO',null,scope===null));
  for(const id of chain(scope)){
    const i=document.createElement('i'); i.textContent='▸'; c.appendChild(i);
    c.appendChild(mk(String(N[id].level),N[id].name,id,id===scope));
  }

  const tb=document.getElementById('tabs'); tb.innerHTML='';
  for(const [k,lbl] of [['map','◱ Mapa'],['list','☰ Localidades']]){
    const b=document.createElement('button'); b.textContent=lbl;
    b.setAttribute('aria-pressed',String(k===tab));
    b.onclick=()=>{tab=k; if(k==='map') query=''; drawChrome(); drawSide();};
    tb.appendChild(b);
  }

  const hs=document.getElementById('hudstats'); hs.innerHTML='';
  const add=(v,l)=>{const d=document.createElement('div'); d.className='st';
    const b=document.createElement('b'); b.textContent=v; d.appendChild(b);
    const s=document.createElement('span'); s.textContent=l; d.appendChild(s);
    hs.appendChild(d);};
  const tot=Object.keys(N).length;
  const cidades=Object.values(N).filter(n=>n.kind==='city').length;
  const bairros=Object.values(N).filter(n=>n.kind==='district').length;
  const inter=Object.values(N).reduce((a,n)=>a+actsOf(n.id).length,0);
  add(tot,'zonas'); add(cidades,'cidades'); add(bairros,'bairros');
  add(inter,'interações'); add(Object.keys(edits).length,'editadas');

  const lg=document.getElementById('legend'); lg.innerHTML='';
  const h=document.createElement('h4'); h.textContent='Categorias de interação';
  lg.appendChild(h);
  for(const k of Object.keys(CAT)){
    if(k==='unclassified') continue;
    const d=document.createElement('div');
    const i=document.createElement('i'); i.style.background=css(CAT[k].c);
    d.appendChild(i); d.appendChild(document.createTextNode(CAT[k].g+'  '+CAT[k].n));
    lg.appendChild(d);
  }
}

/* ── interação: clique, zoom, arrasto, edição ───────────── */
const pt=(ev)=>{const r=SVG.getBoundingClientRect();
  return {x:view.x+(ev.clientX-r.left)/r.width*view.w,
          y:view.y+(ev.clientY-r.top)/r.height*view.h};};

let drag=null;
SVG.addEventListener('pointerdown',ev=>{
  const t=ev.target.closest('[data-id]');
  if(editing && t){
    const id=t.dataset.id, r={...rectOf(id)};
    drag={id,r,start:pt(ev),resize:t.dataset.resize==='1'};
    SVG.setPointerCapture(ev.pointerId); return;
  }
  drag={pan:true,start:pt(ev),v:{...view}};
  SVG.setPointerCapture(ev.pointerId);
});
SVG.addEventListener('pointermove',ev=>{
  if(!drag) return;
  const p=pt(ev), dx=p.x-drag.start.x, dy=p.y-drag.start.y;
  if(drag.pan){
    target={x:drag.v.x-dx,y:drag.v.y-dy,w:view.w,h:view.h};
    view={...target}; SVG.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
    return;
  }
  const r=drag.r;
  edits[drag.id]= drag.resize
    ? {x:r.x,y:r.y,w:Math.max(8,r.w+dx),h:Math.max(8,r.h+dy),edited:true}
    : {x:r.x+dx,y:r.y+dy,w:r.w,h:r.h,edited:true};
  draw();
});
SVG.addEventListener('pointerup',ev=>{
  if(drag&&!drag.pan) drawChrome();     // atualiza o contador de zonas editadas
  if(drag&&!drag.pan&&!drag.resize){
    const moved=Math.abs(pt(ev).x-drag.start.x)+Math.abs(pt(ev).y-drag.start.y);
    if(moved<2){ const id=drag.id;
      if(sel===id&&N[id].childIds.length) enter(id); else {sel=id; draw();} }
  } else if(drag&&drag.pan){
    const moved=Math.abs(pt(ev).x-drag.start.x)+Math.abs(pt(ev).y-drag.start.y);
    if(moved<2){ const t=ev.target.closest('[data-id]');
      if(t){const id=t.dataset.id;
        if(sel===id&&N[id].childIds.length) enter(id); else {sel=id; draw();}}
    }
  }
  drag=null;
});
SVG.addEventListener('wheel',ev=>{
  ev.preventDefault();
  const p=pt(ev), k=ev.deltaY>0?1.13:1/1.13;
  const nw=Math.min(W.world.w*2.5,Math.max(20,view.w*k));
  const s=nw/view.w;
  target={x:p.x-(p.x-view.x)*s,y:p.y-(p.y-view.y)*s,w:nw,h:view.h*s};
  view={...target}; SVG.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
},{passive:false});

document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'){ if(sel){sel=null;draw();}
    else if(scope!==null) enter(N[scope].parentId); }
});

document.getElementById('lens').onclick=e=>{
  lens=!lens; e.currentTarget.setAttribute('aria-pressed',String(lens)); draw();};
document.getElementById('edit').onclick=e=>{
  editing=!editing; e.currentTarget.setAttribute('aria-pressed',String(editing));
  document.getElementById('map').classList.toggle('editing',editing); draw();};
document.getElementById('export').onclick=()=>{
  const out={note:'Zonas movidas à mão. worldbuild.py preserva estas e gera o resto.',
             world:W.world, rects:edits};
  const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='layout.br.json'; a.click();
};
window.addEventListener('resize',draw);

frame(null); tick(); drawChrome(); draw();
const _e=enter; enter=(id)=>{_e(id);drawChrome();};
})();
</script>
